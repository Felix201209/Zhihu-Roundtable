name: Verify

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check browser gate
        run: |
          google-chrome --version || \
          google-chrome-stable --version || \
          chromium --version || \
          chromium-browser --version

      - name: Verify submission package
        run: npm run verify:submission
        env:
          PRODUCTION_FLOW_REQUIRE_BROWSER: "true"
