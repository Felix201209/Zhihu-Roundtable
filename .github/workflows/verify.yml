name: Verify

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check browser gate
        run: |
          google-chrome --version || \
          google-chrome-stable --version || \
          chromium --version || \
          chromium-browser --version

      - name: Verify core
        run: npm run verify

      - name: Check verifier scripts
        run: |
          node --check scripts/capture-demo-screenshots.mjs
          node --check scripts/serve-demo.mjs
          node --check scripts/package-source.mjs
          node --check scripts/verify-public-demo.mjs
          node --check scripts/verify-external-preflight.mjs
          node --check scripts/verify-remote-ci.mjs
          node --check scripts/verify-production-server.mjs
          node --check scripts/verify-production-flow.mjs
          node --check scripts/verify-raspberry-pi-templates.mjs

      - name: Verify Raspberry Pi templates
        run: npm run verify:raspberry-pi

      - name: Verify production server
        run: node scripts/verify-production-server.mjs

      - name: Verify production browser flow
        run: node scripts/verify-production-flow.mjs
        env:
          PRODUCTION_FLOW_REQUIRE_BROWSER: "true"

      - name: Completion audit
        run: npm run completion:audit

      - name: Package source
        run: npm run package:source

      - name: Print submission evidence
        run: npm run evidence:submission
